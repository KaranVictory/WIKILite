{% extends 'base.html' %}
{% block title %}로그인 - {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <div class="eyebrow">WELCOME BACK</div><h1>로그인</h1>
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">아이디</label><input id="username" name="username" autocomplete="username" required>
    <label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary-button full-width" type="submit">로그인</button>
  </form>
  <p class="ip-collection-note">보안 및 악용 방지를 위해 성공한 로그인 시 IP 주소와 시각을 기록하며, 로그인 기록은 최대 180일 보관합니다. <a href="{{ url_for('privacy_page') }}">개인정보 처리 안내</a></p>
  <p class="muted">계정이 없나요? <a href="{{ url_for('register') }}">회원가입</a> · <a href="{{ url_for('terms_page') }}">이용약관</a></p>
</div></div>
{% endblock %}
