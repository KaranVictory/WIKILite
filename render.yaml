services:
  - type: web
    name: namu-lite
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WIKI_NAME
        value: NamuLite Wiki
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
